guardrails:
  - kind: "quality"
    rule: "Require unit and integration validations before promoting Constraint Compilation for urban planning and mobility."
    automation: "run-validation:unit+integration+simulation+regression-baseline"
  - kind: "reliability"
    rule: "Trigger rollback on critical posture or repeated failures."
    automation: "rollback:rollback-to-last-stable-baseline"
  - kind: "compliance"
    rule: "Require policy and approval gates prior to autonomous deployment."
    automation: "approval-gates:policy-constraint-check+evidence-review"
  - kind: "cost"
    rule: "Respect bounded resource pressure and execution budget during scaling."
    automation: "budget-guard:resource-pressure-cap"
